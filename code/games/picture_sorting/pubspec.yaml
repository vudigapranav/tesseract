name: picture_sorting
description: >
  Picture Sorting — put each picture into the group it belongs to. Ported to
  Flutter from Ruthika's original HTML/JS implementation. Depends only on
  tesseract_game_contract.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  tesseract_game_contract:
    path: ../../packages/tesseract_game_contract

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
